# Configurazione Netlify — sito statico, nessuna build necessaria.
# Il prototipo gira interamente nel browser (HTML + JS).

[build]
  publish = "."
  command = ""

# Header di sicurezza di base
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
